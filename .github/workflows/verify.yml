name: Verify source lock
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/validate-lock.py --source-only
      - run: python3 -m unittest discover -s tests
      - run: bash -n scripts/*.sh
      - run: python3 -m py_compile scripts/validate-lock.py scripts/package_toolchain.py
